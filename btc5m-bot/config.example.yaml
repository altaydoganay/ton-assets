# Copy to config.yaml and edit. Secrets (PRIVATE_KEY) go in .env, NEVER here.

mode: demo            # "demo" = paper (no money) | "live" = real money on Polymarket
asset: btc            # trades the btc-updown-5m series

# --- strategy ---
# signal_mode:
#   btc_move        -> enter the side BTC favors once it has moved far enough from
#                      the window's open price. WORKS on these markets (the order
#                      book stays ~0.50 until the final seconds, so the old logic
#                      rarely fired). This is the default.
#   book_threshold  -> original logic: buy a side whose ask is already >= threshold.
signal_mode: btc_move
move_threshold_usd: 10.0    # btc_move: enter when |BTC spot - strike| >= this ($)
threshold: 0.70             # book_threshold mode only
max_entry_price: 0.90       # never pay more than this (entry discipline)
stop_loss_pct: 0.25         # exit if the mark falls this fraction below entry
exit_before_sec: 5          # always flatten this many seconds before close
entry_window_max_sec: 120   # only consider entering inside this window
min_entry_seconds_left: 10

# --- sizing / risk ---
stake_usd: 5.0              # nominal stake per trade
max_notional_usd: 8.0      # hard cap per position
daily_max_loss_usd: 25.0   # halt trading for the day past this loss
max_trades_per_day: 12
slippage_bps: 10.0         # modeled adverse fill

# --- demo ---
demo_starting_balance_usd: 1000.0

# --- loop ---
poll_sec: 3

# --- live endpoints (no secrets) ---
clob_host: https://clob.polymarket.com
chain_id: 137
# 0 = your wallet (EOA) holds USDC directly
# 1 = email/Magic Polymarket account (funds in a proxy wallet -> set FUNDER_ADDRESS)
# 2 = browser-wallet Polymarket account (Gnosis Safe proxy -> set FUNDER_ADDRESS)
signature_type: 0
