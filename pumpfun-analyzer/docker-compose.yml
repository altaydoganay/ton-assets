services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pump}
      POSTGRES_DB: ${POSTGRES_DB:-pumpfun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Yalnızca iç ağ; ana makine portu açılmaz (5432 çakışmasını önler).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pump} -d ${POSTGRES_DB:-pumpfun}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Yalnızca iç ağ; ana makine portu açılmaz (6379 çakışmasını önler).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Tek bir backend imajı; worker/beat/listener AYNI imajı paylaşır.
    # Böylece `backend` yeniden kurulunca hepsi güncel kodu alır (stale imaj olmaz).
    image: pumpfun-analyzer-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - keystore_data:/app/data

  worker:
    image: pumpfun-analyzer-backend
    # concurrency=2: Helius çağrılarının paralel katlanmasını sınırla (kredi koru).
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - keystore_data:/app/data

  beat:
    image: pumpfun-analyzer-backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - backend

  # Canlı olay akışı dinleyicisi: PumpPortal'dan yeni token alıcılarını keşfeder
  # ve takipteki cüzdan işlemlerinde bildirim + (ayar açıksa) kopya işlem yapar.
  listener:
    image: pumpfun-analyzer-backend
    # LISTENER_PROVIDER'a göre Helius (ücretsiz) veya PumpPortal dinleyicisi.
    command: python -m app.workers.run_listener
    env_file: .env
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* derleme anında gömülür; tarayıcı bu adresten API'ye gider.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  keystore_data:
